<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Αμμοθίνες lite</title>
  <meta name="theme-color" content="#0E7C86">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="../lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="../lib/fa/css/fontawesome.min.css">
  <link rel="stylesheet" href="../lib/fa/css/solid.min.css">
  <link rel="stylesheet" href="../lib/fa/css/regular.min.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="css/lite.css">
</head>
<body>
  <header id="topbar">
    <div id="topTitle"></div>
    <div class="top-actions">
      <button id="btnPrepTop" class="top-btn" type="button" data-act="tab" data-tab="prep" title="Ρύθμιση ομάδας και περιοχής"><i class="fa-solid fa-sliders"></i> <span>Ρύθμιση</span></button>
      <button id="btnSendTop" class="top-btn" type="button" data-act="tab" data-tab="send" title="Αποστολή δεδομένων"><i class="fa-solid fa-paper-plane"></i> <span id="sendBadge">Αποστολή</span></button>
      <div id="netBadge" class="net"></div>
    </div>
  </header>

  <main id="views">
    <section id="view-prep" class="view active"></section>
    <section id="view-work" class="view"></section>
    <section id="view-map" class="view">
      <div id="map"></div>
      <div id="mapTools">
        <button id="btnLocate" class="mt" type="button"><i class="fa-solid fa-location-crosshairs"></i> Η θέση μου</button>
        <button id="btnFit" class="mt" type="button"><i class="fa-solid fa-expand"></i> Περιοχή</button>
        <button id="btnBase" class="mt" type="button">Υπόβαθρο</button>
        <button id="btnMapPlants" class="mt" type="button" data-act="plants-open"><i class="fa-solid fa-leaf"></i> Φυτά</button>
      </div>
      <div id="pinBar"></div>
      <div id="placeBanner" hidden>
        <div id="placeText"></div>
        <div class="btn-row">
          <button id="placeOk" class="btn primary" type="button"><i class="fa-solid fa-check"></i> Εδώ</button>
          <button id="placeCancel" class="btn" type="button">Άκυρο</button>
        </div>
      </div>
    </section>
    <section id="view-plants" class="view"></section>
    <section id="view-send" class="view"></section>
  </main>

  <nav id="tabbar">
    <button type="button" class="tab active" data-act="tab" data-tab="work"><span><i class="fa-solid fa-compass"></i></span>Έρευνα</button>
    <button type="button" class="tab" data-act="tab" data-tab="map"><span><i class="fa-solid fa-map"></i></span>Χάρτης</button>
    <button type="button" class="tab" data-act="plants-open" data-tab="plants"><span><i class="fa-solid fa-leaf"></i></span>Φυτά</button>
  </nav>

  <div id="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="btn small" type="button" data-act="plants-open"><i class="fa-solid fa-leaf"></i> Φυτά</button>
      </div>
      <div id="sheetBody"></div>
      <div class="sheet-foot">
        <button id="sheetDelete" class="btn danger" type="button" hidden><i class="fa-solid fa-trash-can"></i> Διαγραφή</button>
        <span class="spacer"></span>
        <button id="sheetCancel" class="btn" type="button">Άκυρο</button>
        <button id="sheetSave" class="btn primary" type="button"><i class="fa-solid fa-check"></i> Αποθήκευση</button>
      </div>
    </div>
  </div>

  <div id="viewer" hidden>
    <div class="viewer-top">
      <div id="viewerTitle"></div>
      <button class="btn" type="button" data-act="viewer-close"><i class="fa-solid fa-xmark"></i> Κλείσιμο</button>
    </div>
    <div id="viewerStage"><img id="viewerImg" alt="" draggable="false"></div>
    <div class="viewer-bottom">
      <div id="viewerCap"></div>
      <div class="btn-row">
        <button class="btn" type="button" data-act="viewer-step" data-d="-1"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="btn" type="button" data-act="viewer-zoom" data-z="1"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
        <button class="btn" type="button" data-act="viewer-zoom" data-z="-1"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
        <button class="btn" type="button" data-act="viewer-step" data-d="1"><i class="fa-solid fa-chevron-right"></i></button>
        <button id="viewerPick" class="btn primary" type="button" data-act="viewer-pick" hidden><i class="fa-solid fa-check"></i> Αυτό είναι!</button>
      </div>
    </div>
  </div>

  <div id="scanBox" hidden>
    <div class="scan-card">
      <video id="scanVideo" playsinline muted></video>
      <div class="scan-frame" aria-hidden="true"></div>
      <p id="scanText"></p>
      <button class="btn" type="button" data-act="scan-close">Κλείσιμο</button>
    </div>
  </div>

  <div id="dialog" hidden>
    <div class="dialog-card">
      <p id="dialogText"></p>
      <div class="btn-row">
        <button id="dialogCancel" class="btn" type="button">Όχι</button>
        <button id="dialogOk" class="btn primary" type="button">Ναι</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <input id="fileTop" type="file" accept="image/*" capture="environment" hidden>
  <input id="fileTopGal" type="file" accept="image/*" hidden>
  <input id="fileCam" type="file" accept="image/*" capture="environment" hidden>
  <input id="importFile" type="file" accept=".zip,application/zip" multiple hidden>

  <script src="../lib/leaflet/leaflet.js"></script>
  <script src="../lib/jszip.min.js"></script>
  <script src="../lib/jsQR.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
