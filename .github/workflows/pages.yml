name: Έλεγχος και δημοσίευση

# Το deploy ΔΕΝ τρέχει αν χτυπήσει κάποιος φύλακας (tools/check_all.mjs).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Εγκατάσταση ESLint
        run: npm install --no-audit --no-fund
        working-directory: tools
      - name: Φύλακες
        run: node tools/check_all.mjs

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Φάκελος δημοσίευσης (χωρίς tools)
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js lib icons plants _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
